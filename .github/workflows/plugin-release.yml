name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # 复用 dbx 官方打包工作流：按平台构建 .dbxp 并生成产物元数据
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.6
      # Rust sidecar → 每个平台一个包（target 用 DBX 目标名）
      build-matrix: '{"include":[{"runner":"windows-2022","target":"windows-x64"},{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"macos-15","target":"darwin-arm64"}]}'
