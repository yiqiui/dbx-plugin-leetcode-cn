<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetCode 刷题</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif; --brand: #ffb100; --border: color-mix(in srgb, CanvasText 14%, transparent); --muted: color-mix(in srgb, CanvasText 60%, transparent); }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: Canvas; color: CanvasText; font-size: 13px; }
      header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
      header .brand { font-weight: 700; color: var(--brand); }
      header .spacer { flex: 1; }
      header .who { color: var(--muted); }
      button { border: 1px solid var(--border); background: color-mix(in srgb, CanvasText 6%, transparent); color: inherit; border-radius: 8px; padding: 5px 12px; font: inherit; cursor: pointer; }
      button:hover { background: color-mix(in srgb, CanvasText 12%, transparent); }
      button:disabled { opacity: .5; cursor: wait; }
      button.primary { background: var(--brand); color: #1a1400; border-color: transparent; font-weight: 650; }
      input, select, textarea { font: inherit; color: inherit; background: color-mix(in srgb, CanvasText 4%, transparent); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; }
      .row { display: flex; align-items: center; gap: 8px; }
      main { flex: 1; min-height: 0; display: flex; }
      .pane { min-height: 0; overflow: auto; }
      #listView { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #solveView { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #solveView.fullscreen { position: fixed; inset: 0; z-index: 50; background: Canvas; }
      .solve-bar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
      .solve-bar .spacer { flex: 1; }
      .solve-title { font-weight: 650; }
      .solve-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--descw, 50%) 6px 1fr; }
      #splitter { cursor: col-resize; background: transparent; }
      #splitter:hover, #splitter.dragging { background: color-mix(in srgb, var(--brand) 55%, transparent); }
      .pager { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
      .pager button { padding: 3px 9px; }
      .pager select, .pager input { padding: 3px 6px; }
      .pager input.page { width: 48px; text-align: center; }
      .pager .spacer { flex: 1; }
      .toolbar { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
      .toolbar .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .toolbar input#search { flex: 1; min-width: 180px; }
      .cats { display: flex; align-items: center; gap: 2px; padding: 6px 10px 0; overflow-x: auto; scrollbar-width: thin; }
      .cat { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 8px 8px 0 0; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
      .cat:hover { background: color-mix(in srgb, CanvasText 6%, transparent); color: inherit; }
      .cat[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
      .tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); background: color-mix(in srgb, CanvasText 4%, transparent); color: inherit; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
      .tag:hover { border-color: color-mix(in srgb, var(--brand) 60%, transparent); }
      .tag .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
      .tag[aria-pressed="true"] { background: color-mix(in srgb, var(--brand) 22%, transparent); border-color: var(--brand); font-weight: 650; }
      .tag[aria-pressed="true"] .n { color: inherit; }
      .tags .more { color: var(--brand); font-weight: 650; border-style: dashed; }
      .tags.collapsed { max-height: 30px; overflow: hidden; }
      .active-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
      /* 左侧导航（题目 / 收藏 / 每日一题 + 官网板块入口） */
      #nav { width: 132px; flex: 0 0 132px; border-right: 1px solid var(--border); padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
      #nav .nav-item { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; color: var(--muted); padding: 7px 9px; border-radius: 8px; font: inherit; text-align: left; cursor: pointer; }
      #nav .nav-item:hover { background: color-mix(in srgb, CanvasText 7%, transparent); color: inherit; }
      #nav .nav-item[aria-current="page"] { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); font-weight: 650; }
      #nav .nav-group { margin-top: 10px; padding: 6px 9px 2px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
      #nav .nav-item .ico { width: 16px; text-align: center; }
      /* 右侧栏（每日一题 / 企业题库） */
      #rail { width: 232px; flex: 0 0 232px; border-left: 1px solid var(--border); padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
      #rail .box { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
      #rail h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
      #rail .daily-q { cursor: pointer; font-weight: 600; line-height: 1.45; }
      #rail .daily-q:hover { color: var(--brand); }
      .companies { display: flex; flex-wrap: wrap; gap: 6px; }
      .companies button { padding: 3px 8px; font-size: 12px; border-radius: 999px; }
      .sortbar { display: flex; align-items: center; gap: 6px; }
      .sortbar select { min-width: 104px; }
      #sortDir { padding: 5px 9px; }
      .fav { width: 34px; text-align: center; cursor: pointer; font-size: 14px; color: color-mix(in srgb, CanvasText 32%, transparent); }
      .fav:hover { color: var(--brand); }
      .fav.on { color: var(--brand); }
      .brand-ico { width: 22px; height: 22px; border-radius: 6px; }
      .avatar-img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
      .avatar { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #ffc84a, #f08c00); color: #3d2a00; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 20px; }
      .who { display: inline-flex; align-items: center; gap: 6px; }
      .tags-wrap { display: flex; align-items: flex-start; gap: 8px; }
      .tags-scroll { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
      .tags-scroll.clip { max-height: 28px; overflow: hidden; }
      @media (max-width: 1080px) { #rail { display: none; } }
      /* 导航折叠由用户控制，不再按宽度强制收成图标（否则标签永远看不到） */
      #nav.collapsed { width: 46px; flex-basis: 46px; }
      #nav.collapsed .label, #nav.collapsed .nav-group { display: none; }
      #nav.collapsed .nav-item { justify-content: center; }
      #nav.collapsed #navToggle .ico { transform: rotate(180deg); }
      #sectionView { flex: 1; min-width: 0; overflow: auto; padding: 14px 16px; }
      #sectionView h2 { margin: 0 0 4px; font-size: 17px; }
      #sectionView .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
      .cardx { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, CanvasText 3%, transparent); }
      .cardx .t { font-weight: 650; }
      .cardx .d { font-size: 12px; color: var(--muted); line-height: 1.5; }
      .cardx .meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
      .cardx button { align-self: flex-start; margin-top: 4px; }
      .group { margin: 16px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: Canvas; }
      td.title { white-space: normal; }
      tr.q { cursor: pointer; }
      tr.q:hover { background: color-mix(in srgb, CanvasText 6%, transparent); }
      tr.q.active { background: color-mix(in srgb, var(--brand) 18%, transparent); }
      .diff-Easy { color: #26a641; } .diff-Medium { color: #ffd700; } .diff-Hard { color: #ff375f; }
      .ac { color: #26a641; }
      #descPane { padding: 14px 18px; border-right: 1px solid var(--border); }
      #descPane h2 { margin: 0 0 6px; font-size: 18px; }
      #editorPane { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      .code-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .code-bar select { min-width: 120px; }
      .code-bar .spacer { flex: 1; }
      .editor-wrap { flex: 1; min-height: 0; display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: color-mix(in srgb, CanvasText 4%, transparent); }
      .gutter { padding: 8px 6px; text-align: right; color: var(--muted); border-right: 1px solid var(--border); background: color-mix(in srgb, CanvasText 3%, transparent); user-select: none; overflow: hidden; }
      .gutter, .hl, #code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.5; tab-size: 4; white-space: pre; }
      .editor-scroll { position: relative; flex: 1; min-width: 0; }
      .hl { position: absolute; inset: 0; margin: 0; padding: 8px; overflow: hidden; pointer-events: none; color: CanvasText; }
      #code { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 8px; border: 0; outline: none; background: transparent; color: transparent; caret-color: CanvasText; resize: none; overflow: auto; }
      .tk-kw { color: #c678dd; } .tk-str { color: #98c379; } .tk-com { color: #7f848e; font-style: italic; } .tk-num { color: #d19a66; } .tk-fn { color: #61afef; } .tk-type { color: #e5c07b; }
      .content { line-height: 1.7; }
      .content pre, .content code { background: color-mix(in srgb, CanvasText 8%, transparent); border-radius: 6px; padding: 1px 5px; }
      .content pre { padding: 10px; overflow: auto; }
      .content img { max-width: 100%; height: auto; }
      .content table { border-collapse: collapse; margin: 8px 0; }
      .content td, .content th { border: 1px solid var(--border); padding: 4px 8px; }
      .content p { margin: 8px 0; }
      .stats { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
      .result { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
      .result.ok { border-color: #26a641; } .result.bad { border-color: #ff375f; }
      .muted { color: var(--muted); }
      .hidden { display: none !important; }
      #login { position: absolute; inset: 0; display: grid; place-items: center; background: Canvas; z-index: 5; }
      #login .card { width: min(360px, 90%); display: flex; flex-direction: column; gap: 12px; padding: 26px; border: 1px solid var(--border); border-radius: 16px; }
      .status { padding: 10px 14px; }
    </style>
  </head>
  <body>
    <div id="login">
      <div class="card">
        <div class="brand" style="font-size:18px;font-weight:800;color:var(--brand)">LeetCode 登录</div>
        <div class="muted" style="font-size:12px">点击下方按钮会弹出一个【专用登录窗口】，你在里面用手机号/验证码或账号密码登录力扣（极验滑块在真实浏览器里可正常通过）。登录成功后插件会自动取回登录态并进入题库，无需你手动粘贴 Cookie。</div>
        <button type="button" id="oneClickLoginBtn" class="primary" style="width:100%">用浏览器登录并自动导入（推荐，免粘贴）</button>
        <div class="muted" id="oneClickHint" style="font-size:12px;min-height:16px"></div>
        <div id="loginMsg" class="muted"></div>
      </div>
    </div>

    <header>
      <svg class="brand-ico" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="bic" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#ffc84a"/><stop offset=".55" stop-color="#ffb100"/><stop offset="1" stop-color="#f08c00"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#bic)"/><g fill="none" stroke="#3d2a00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 14.5 7 24l7.5 9.5"/><path d="M25 14.5 32.5 24 25 33.5"/></g><circle cx="36" cy="33" r="8.5" fill="#1f7a3d"/><path d="M32.1 33.1l2.9 2.9 5-5.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand">LeetCode 刷题</span>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button id="refreshBtn" type="button">刷新题库</button>
      <button id="logoutBtn" type="button">退出</button>
    </header>

    <main>
      <aside id="nav" aria-label="板块导航">
        <button type="button" class="nav-item" id="navToggle" title="展开 / 收起导航"><span class="ico">«</span><span class="label">收起导航</span></button>
        <button type="button" class="nav-item" data-view="list" data-slug="" aria-current="page"><span class="ico">▤</span><span class="label">题目</span></button>
        <button type="button" class="nav-item" data-view="favs"><span class="ico">★</span><span class="label">我的收藏</span></button>
        <button type="button" class="nav-item" data-view="daily"><span class="ico">◉</span><span class="label">每日一题</span></button>
        <div class="nav-group">官网板块</div>
        <button type="button" class="nav-item" data-view="explore"><span class="ico">🧭</span><span class="label">探险模式</span></button>
        <button type="button" class="nav-item" data-view="studyplan"><span class="ico">🎓</span><span class="label">学习计划</span></button>
      </aside>
      <section id="listView">
        <nav class="cats" id="cats" role="tablist" aria-label="题目分类"></nav>
        <div class="toolbar">
          <div class="filters">
            <input id="search" placeholder="搜索题目（标题 / 题号 / 关键词，需登录）" />
            <select id="difficulty">
              <option value="">全部难度</option>
              <option value="EASY">简单</option>
              <option value="MEDIUM">中等</option>
              <option value="HARD">困难</option>
            </select>
            <select id="status">
              <option value="">作答状态</option>
              <option value="AC">已解答</option>
              <option value="NOT_SOLVED">未尝试</option>
              <option value="TRIED">尝试过</option>
            </select>
            <button id="resetBtn" type="button">重置筛选</button>
            <div class="sortbar">
              <select id="sortField" title="排序字段">
                <option value="">默认排序</option>
                <option value="FRONTEND_ID">题号</option>
                <option value="DIFFICULTY">难度</option>
                <option value="AC_RATE">通过率</option>
                <option value="FREQUENCY">出题频率</option>
                <option value="CONTEST_POINT">竞赛分</option>
              </select>
              <button id="sortDir" type="button" title="切换升 / 降序">↑</button>
            </div>
            <button id="randomBtn" type="button" title="从当前筛选结果中随机抽一题">随机一题</button>
          </div>
          <div class="tags-wrap">
            <div class="tags-scroll clip" id="tags"></div>
            <button type="button" class="tag more" id="tagsToggle" hidden>展开 ▼</button>
          </div>
        </div>
        <div id="listStatus" class="status muted">未登录</div>
        <div style="flex:1;min-height:0;overflow:auto">
          <table id="qtable" class="hidden">
            <thead><tr><th></th><th>题目</th><th>标签</th><th>通过率</th><th>难度</th><th title="收藏">★</th></tr></thead>
            <tbody id="qbody"></tbody>
          </table>
        </div>
        <div class="pager hidden" id="pager">
          <span class="muted">每页</span>
          <select id="pageSize"><option value="15">15</option><option value="30" selected>30</option><option value="50">50</option><option value="100">100</option></select>
          <button id="prevBtn" type="button">‹ 上一页</button>
          <input class="page" id="pageInput" type="number" min="1" value="1" />
          <span class="muted" id="pageInfo">/ 1 页</span>
          <button id="nextBtn" type="button">下一页 ›</button>
          <button id="goBtn" type="button">跳转</button>
          <span class="spacer"></span>
          <span class="muted" id="totalInfo"></span>
        </div>
      </section>

      <section id="sectionView" class="hidden">
        <h2 id="sectionTitle"></h2>
        <div class="sub" id="sectionSub"></div>
        <div id="sectionBody"></div>
      </section>

      <section id="solveView" class="hidden">
        <div class="solve-bar">
          <button id="backBtn" type="button">← 返回题库</button>
          <span class="solve-title" id="solveTitle"></span>
          <span class="spacer"></span>
          <button id="fsBtn" type="button">⤢ 全屏</button>
        </div>
        <div class="solve-grid" id="solveGrid">
          <div class="pane desc" id="descPane"></div>
          <div id="splitter" title="拖动调整左右宽度"></div>
          <div class="pane code" id="editorPane"></div>
        </div>
      </section>

      <aside id="rail" aria-label="侧栏信息">
        <div class="box" id="dailyBox">
          <h4>每日一题</h4>
          <div class="muted" id="dailyBody">加载中…</div>
        </div>
        <div class="box">
          <h4>热门企业题库</h4>
          <div class="companies" id="companies"></div>
        </div>
      </aside>
    </main>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const state = { questions: [], page: 1, pageSize: 30, total: 0, activeSlug: null, snippets: [], loading: false,
                      categorySlug: "", tags: [], allTags: [], tagsExpanded: false, searching: false,
                      sortField: "", sortDesc: false, mode: "list", fullSet: null, fullSetKey: "", me: null, section: null };
      // The official problemset tabs. Slugs are what the site's GraphQL
      // `categorySlug` argument expects (note the singular `database`).
      const CATS = [
        { slug: "", label: "全部题目" },
        { slug: "algorithms", label: "算法" },
        { slug: "database", label: "数据库" },
        { slug: "shell", label: "Shell" },
        { slug: "concurrency", label: "多线程" },
        { slug: "javascript", label: "JavaScript" },
        { slug: "pandas", label: "pandas" },
      ];
      const DIFF_CN = { EASY: "简单", MEDIUM: "中等", HARD: "困难" };
      // Companies shown on the site's problemset rail; these open the official
      // pages because their rankings are not exposed by a stable public API.
      const COMPANIES = [
        ["字节跳动", "/company/bytedance/"], ["华为", "/company/huawei/"], ["亚马逊", "/company/amazon/"],
        ["苹果", "/company/apple/"], ["谷歌", "/company/google/"], ["腾讯", "/company/tencent/"],
        ["Meta", "/company/meta/"], ["微软", "/company/microsoft/"], ["阿里巴巴", "/company/alibaba/"],
        ["美团", "/company/meituan/"], ["英伟达", "/company/nvidia/"], ["Shopee", "/company/shopee/"],
      ];

      async function call(method, params, timeoutMs) {
        const res = await window.dbxPlugin.request("backend.invoke", { method, params: params || {}, timeoutMs: timeoutMs || 60000 });
        return res;
      }
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const diffClass = (d) => "diff-" + String(d || "").toLowerCase().replace(/^\w/, (c) => c.toUpperCase());
      const num = (v) => (typeof v === "number" && isFinite(v) ? v : Number(v) || 0);
      const currentFilters = () => {
        const filters = {};
        if ($("#difficulty").value) filters.difficulty = $("#difficulty").value;
        if ($("#status").value) filters.status = $("#status").value;
        if (state.tags.length) filters.tags = state.tags.slice();
        return filters;
      };
      const filterKey = () => JSON.stringify([state.categorySlug, currentFilters(), $("#search").value.trim()]);

      // Rows in scope: the server page (default order) or the whole filtered set
      // (when a local sort or 只看收藏 is active, so ordering is not page-local).
      function computeRows() {
        // 我的收藏 comes back pre-filtered from the favourites API.
        let rows = state.questions.slice();
        if (state.sortField && state.mode !== "favs") {
          const keys = {
            FRONTEND_ID: (q) => num(q.frontendQuestionId),
            DIFFICULTY: (q) => ({ EASY: 1, MEDIUM: 2, HARD: 3 }[String(q.difficulty || "").toUpperCase()] || 0),
            AC_RATE: (q) => num(q.acRate),
            FREQUENCY: (q) => num(q.frequency),
            CONTEST_POINT: (q) => num(q.contestPoint),
          };
          const key = keys[state.sortField] || keys.FRONTEND_ID;
          const dir = state.sortDesc ? -1 : 1;
          rows.sort((a, b) => (key(a) - key(b)) * dir);
        }
        return rows;
      }

      function renderList() {
        const body = $("#qbody");
        const rows = computeRows();
        const start = (state.page - 1) * state.pageSize;
        // When the keyword already went to the server, do not re-filter locally:
        // server search also matches statement content.
        const kw = state.searching ? "" : $("#search").value.trim().toLowerCase();
        const page = rows.slice(start, start + state.pageSize).filter((q) => !kw
          || (String(q.titleCn || "") + String(q.title || "") + String(q.frontendQuestionId || "")).toLowerCase().includes(kw));
        state.pageRows = page;
        body.innerHTML = page.map((q) => {
          const tags = (q.topicTags || []).slice(0, 3).map((t) => esc(t.nameTranslated || t.translatedName || t.name || t.slug)).join("、");
          return `
          <tr class="q ${q.titleSlug === state.activeSlug ? "active" : ""}" data-slug="${esc(q.titleSlug)}">
            <td>${q.status === "AC" ? '<span class="ac">✓</span>' : ""}</td>
            <td class="title">[${esc(q.frontendQuestionId)}] ${esc(q.titleCn || q.title || q.titleSlug)}${q.paidOnly ? ' <span class="pill">Plus</span>' : ""}</td>
            <td class="muted" style="white-space:normal">${tags || "-"}</td>
            <td>${q.acRate != null ? (num(q.acRate) * 100).toFixed(1) + "%" : "-"}</td>
            <td class="${diffClass(q.difficulty)}">${esc(DIFF_CN[String(q.difficulty || "").toUpperCase()] || q.difficulty || "")}</td>
            <td class="fav ${q.isFavor ? "on" : ""}" data-fav="${esc(q.titleSlug)}" title="${q.isFavor ? "取消收藏" : "收藏"}">${q.isFavor ? "★" : "☆"}</td>
          </tr>`;
        }).join("") || `<tr><td colspan="6" class="muted">没有符合条件的题目</td></tr>`;
        body.querySelectorAll("tr.q").forEach((tr) => tr.addEventListener("click", (e) => {
          if (e.target && e.target.classList.contains("fav")) return;
          openProblem(tr.dataset.slug);
        }));
        body.querySelectorAll(".fav").forEach((cell) => cell.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFav(cell.dataset.fav, cell);
        }));
        renderPager();
      }

      async function toggleFav(slug, cell) {
        const row = (state.pageRows || []).find((q) => q.titleSlug === slug);
        const next = !(row && row.isFavor);
        try {
          const res = await call("leetcode/toggle_favorite", { titleSlug: slug, favorite: next }, 25000);
          // The site answers { ok, error }; treat a falsy ok as a failure so the
          // star never lies about the collection's real state.
          if (res && res.ok === false) {
            $("#listStatus").textContent = "收藏失败：" + (res.error || "力扣拒绝了该操作");
            return;
          }
          if (row) row.isFavor = next;
          const hit = state.questions.find((q) => q.titleSlug === slug);
          if (hit) hit.isFavor = next;
          renderList();
        } catch (e) {
          $("#listStatus").textContent = "收藏失败：" + e.message;
        }
      }

      function renderPager() {
        // Paging is local whenever a sort or 只看收藏 is applied, because the
        // ordering/ filtering spans the whole set rather than one server page.
        const scoped = computeRows().length;
        const shown = state.sortField ? scoped : (state.total || scoped);
        const totalPages = Math.max(1, Math.ceil(shown / state.pageSize));
        if (state.page > totalPages) { state.page = totalPages; }
        $("#pager").classList.toggle("hidden", !shown);
        $("#pageInput").value = state.page;
        $("#pageInput").max = totalPages;
        $("#pageInfo").textContent = `/ ${totalPages} 页`;
        $("#totalInfo").textContent = `共 ${shown} 题`;
        $("#prevBtn").disabled = state.page <= 1;
        $("#nextBtn").disabled = state.page >= totalPages;
      }

      function renderCats() {

          <button type="button" class="cat" role="tab" data-slug="${esc(c.slug)}" aria-selected="${c.slug === state.categorySlug}">${esc(c.label)}</button>

        }));
      }

      // Official tag bar: counts come from the site itself (questionIds.length),
      // so 数组 2430 etc. always match leetcode.cn instead of a frozen list.
      async function loadTags() {
        try {
          const data = await call("leetcode/topic_tags", {}, 30000);

          renderTags();
        } catch (e) {
          $("#tags").innerHTML = `<span class="muted" style="font-size:12px">标签加载失败：${esc(e.message)}</span>`;
        }
      }

      function renderTags() {
        const bar = $("#tags");
        const toggle = $("#tagsToggle");
        if (!state.allTags.length) return;
        const label = (t) => t.translatedName || t.name || t.slug;
        // Chips live in a clipped scroller and the toggle sits outside it, so the

        bar.innerHTML = state.allTags.map((t) => `
          <button type="button" class="tag" data-slug="${esc(t.slug)}" aria-pressed="${state.tags.includes(t.slug)}">${esc(label(t))}<span class="n">${t.count}</span></button>
        `).join("");
        bar.classList.toggle("clip", !state.tagsExpanded);
        if (state.allTags.length > 12) {
          toggle.hidden = false;
          toggle.textContent = state.tagsExpanded ? "收起 ▲" : `展开全部 ${state.allTags.length} 个标签 ▼`;
        } else {
          toggle.hidden = true;
        }
        bar.querySelectorAll(".tag[data-slug]").forEach((btn) => btn.addEventListener("click", () => {
          const slug = btn.dataset.slug;
          const at = state.tags.indexOf(slug);
          if (at >= 0) state.tags.splice(at, 1); else state.tags.push(slug);
          renderTags();
          loadProblems(true);
        }));
      }

      function activeFilterSummary() {
        const parts = [(CATS.find((c) => c.slug === state.categorySlug) || { label: "全部题目" }).label];
        if ($("#difficulty").value) parts.push({ EASY: "简单", MEDIUM: "中等", HARD: "困难" }[$("#difficulty").value]);
        if ($("#status").value) parts.push({ AC: "已解答", NOT_SOLVED: "未尝试", TRIED: "尝试过" }[$("#status").value]);
        if (state.tags.length) parts.push(state.tags.map((slug) => {
          const hit = state.allTags.find((t) => t.slug === slug);
          return hit ? (hit.translatedName || hit.name || slug) : slug;
        }).join("、"));
        if (state.searching) parts.push(`搜索「${$("#search").value.trim()}」`);
        if (state.mode === "favs") parts.push("我的收藏");
        if (state.sortField) {
          const label = { FRONTEND_ID: "题号", DIFFICULTY: "难度", AC_RATE: "通过率", FREQUENCY: "出题频率", CONTEST_POINT: "竞赛分" }[state.sortField];
          parts.push(`按${label}${state.sortDesc ? "降序" : "升序"}`);
        }
        return parts.filter(Boolean).join(" · ");
      }

      // Latest-click-wins: dropping a click because a request is in flight looks
      // exactly like a dead button, so stale responses are discarded instead.
      let requestSeq = 0;
      async function loadProblems(reset) {
        const mine = ++requestSeq;
        state.loading = true;
        if (reset) { state.page = 1; }
        const key = filterKey();
        const needFull = !!state.sortField;
        $("#listStatus").textContent = needFull && state.fullSetKey !== key ? "载入完整筛选结果以排序…" : "加载中…";
        try {
          const keyword = $("#search").value.trim();
          const filters = currentFilters();
          if (state.mode === "favs") {
            // The favourites collection is its own endpoint, so the list is
            // already filtered and paged server-side.
            const fav = await call("leetcode/favorite_questions", { favoriteSlug: "", skip: (state.page - 1) * state.pageSize, limit: state.pageSize }, 60000);
            state.questions = (fav.questions || []).map((q) => ({
              frontendQuestionId: q.questionFrontendId, title: q.title, titleCn: q.translatedTitle, titleSlug: q.titleSlug,
              difficulty: q.difficulty, acRate: q.acRate, status: q.status, paidOnly: q.paidOnly, isFavor: true,
              topicTags: q.topicTags || [],
            }));
            state.total = fav.totalLength || state.questions.length;
          } else if (needFull) {
            // Sorting/favouriting must span the whole selection, so pull the
            // filtered set once (cached per filter combination) and work locally.
            if (state.fullSetKey !== key || !state.fullSet) {
              const all = await call("leetcode/list_all", { filters, categorySlug: state.categorySlug, maxQuestions: 1500 }, 180000);
              state.fullSet = all.questions || [];
              state.fullSetKey = key;
              state.fullTruncated = !!all.truncated;
            }
            state.questions = state.fullSet.slice();
            state.total = state.fullSet.length;
          } else {
            const skip = (state.page - 1) * state.pageSize;
            const data = await call("leetcode/list_problems", { skip, limit: state.pageSize, filters, categorySlug: state.categorySlug, searchKeyword: keyword });
            state.questions = data.questions || [];
            state.total = data.total || state.questions.length;
          }
          state.searching = !!keyword;
          $("#qtable").classList.remove("hidden");
          if (mine !== requestSeq) return;
          const rows = computeRows();
          const start = (state.page - 1) * state.pageSize;
          const from = rows.length ? start + 1 : 0;
          const to = Math.min(start + state.pageSize, rows.length);
          $("#listStatus").textContent = `${activeFilterSummary()} · 共 ${state.sortField ? rows.length : state.total} 题，显示 ${from}-${to}`
            + (state.fullTruncated && state.sortField ? "（仅在前 1500 题内排序）" : "");
          renderList();
        } catch (e) {
          if (mine === requestSeq) $("#listStatus").textContent = "加载失败：" + e.message;
        } finally { if (mine === requestSeq) state.loading = false; }
      }

      const KW = {

        php: "abstract and array as break callable case catch class clone const continue declare default do echo else elseif empty enddeclare endfor endforeach endif endswitch endwhile extends final finally fn for foreach function global goto if implements include instanceof insteadof interface isset list match namespace new or print private protected public readonly require return static switch throw trait try unset use var while xor yield true false null",

      const kwset = (s) => new Set(s.split(/\s+/));
      function langConfig(slug) {
        slug = String(slug || "").toLowerCase();
        if (slug.startsWith("python") || slug === "pypy") return { kw: kwset(KW.python), line: "#", block: null };
        if (slug === "ruby") return { kw: kwset(KW.ruby), line: "#", block: ["=begin", "=end"] };
        if (slug === "bash" || slug === "shell") return { kw: kwset(KW.bash), line: "#", block: null };
        if (slug.includes("sql")) return { kw: kwset(KW.sql + " " + KW.sql.toUpperCase()), line: "--", block: ["/*", "*/"] };
        if (slug === "go" || slug === "golang") return { kw: kwset(KW.go), line: "//", block: ["/*", "*/"] };
        if (slug === "rust") return { kw: kwset(KW.rust), line: "//", block: ["/*", "*/"] };
        if (slug === "java") return { kw: kwset(KW.java), line: "//", block: ["/*", "*/"] };
        if (slug === "kotlin") return { kw: kwset(KW.kotlin), line: "//", block: ["/*", "*/"] };
        if (slug === "swift") return { kw: kwset(KW.swift), line: "//", block: ["/*", "*/"] };
        if (slug === "php") return { kw: kwset(KW.php), line: "//", block: ["/*", "*/"] };
        if (slug === "csharp") return { kw: kwset(KW.csharp), line: "//", block: ["/*", "*/"] };
        if (slug === "javascript" || slug === "typescript" || slug === "angular" || slug === "vue") return { kw: kwset(KW.javascript), line: "//", block: ["/*", "*/"] };
        return { kw: kwset(KW.clike), line: "//", block: ["/*", "*/"] };
      }
      function highlight(code, slug) {
        const cfg = langConfig(slug); const kw = cfg.kw; const n = code.length; let out = ""; let i = 0;
        while (i < n) {
          const c = code[i];
          if (cfg.line && code.startsWith(cfg.line, i)) { let j = code.indexOf("\n", i); if (j < 0) j = n; out += `<span class="tk-com">${esc(code.slice(i, j))}</span>`; i = j; continue; }
          if (cfg.block && code.startsWith(cfg.block[0], i)) { let j = code.indexOf(cfg.block[1], i + cfg.block[0].length); j = j < 0 ? n : j + cfg.block[1].length; out += `<span class="tk-com">${esc(code.slice(i, j))}</span>`; i = j; continue; }
          if (c === '"' || c === "'" || c === "`") { let j = i + 1; while (j < n) { if (code[j] === "\\") { j += 2; continue; } if (code[j] === c) { j++; break; } j++; } out += `<span class="tk-str">${esc(code.slice(i, j))}</span>`; i = j; continue; }
          if (c >= "0" && c <= "9") { let j = i; while (j < n && /[0-9a-fA-FxX._]/.test(code[j])) j++; out += `<span class="tk-num">${esc(code.slice(i, j))}</span>`; i = j; continue; }
          if (/[A-Za-z_$]/.test(c)) { let j = i; while (j < n && /[A-Za-z0-9_$]/.test(code[j])) j++; const w = code.slice(i, j); out += kw.has(w) ? `<span class="tk-kw">${esc(w)}</span>` : esc(w); i = j; continue; }
          out += esc(c); i++;
        }
        return out;
      }

      function editorHtml(langs) {
        return `
          <div class="code-bar">
            <select id="lang">${langs}</select>
            <button id="runBtn" type="button">运行</button>
            <button id="submitBtn" class="primary" type="button">提交</button>
            <span class="spacer"></span>
            <button id="favBtn" type="button">☆ 收藏</button>
            <button id="histBtn" type="button">提交历史</button>
          </div>
          <div class="editor-wrap">
            <div class="gutter" id="gutter">1</div>
            <div class="editor-scroll">
              <pre class="hl" id="hl"></pre>
              <textarea class="code" id="code" spellcheck="false" wrap="off"></textarea>
            </div>
          </div>
          <div id="result" class="result hidden"></div>
          <div id="history" class="result hidden"></div>
          <span class="muted" id="editorHint"></span>`;
      }
      function fillSnippet() {
        const snip = state.snippets.find((s) => s.langSlug === $("#lang").value);
        $("#code").value = snip ? snip.code : "";
      }
      function wireEditor() {
        const code = $("#code"), hl = $("#hl"), gutter = $("#gutter"), lang = $("#lang");
        const syncScroll = () => { hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; gutter.scrollTop = code.scrollTop; };
        const update = () => {
          const v = code.value;
          hl.innerHTML = highlight(v, lang.value) + "\n";
          let g = ""; const lines = v.split("\n").length;
          for (let k = 1; k <= lines; k++) g += k + "\n";
          gutter.textContent = g;
          syncScroll();
        };
        code.addEventListener("input", update);
        code.addEventListener("scroll", syncScroll);
        lang.addEventListener("change", () => { fillSnippet(); update(); });
        code.addEventListener("keydown", (e) => {
          if (e.key === "Tab") { e.preventDefault(); const s = code.selectionStart, en = code.selectionEnd; code.value = code.value.slice(0, s) + "    " + code.value.slice(en); code.selectionStart = code.selectionEnd = s + 4; update(); }
          else if (e.key === "Enter") {
            const s = code.selectionStart; const before = code.value.slice(0, s); const ls = before.lastIndexOf("\n") + 1;
            const indent = (before.slice(ls).match(/^[ \t]*/) || [""])[0]; const extra = /[{([:]\s*$/.test(before) ? "    " : "";
            if (indent || extra) { e.preventDefault(); const ins = "\n" + indent + extra; code.value = code.value.slice(0, s) + ins + code.value.slice(code.selectionEnd); code.selectionStart = code.selectionEnd = s + ins.length; update(); }
          }
        });
        window.__updateEditor = update;
        update();
      }

      async function openProblem(slug) {
        state.activeSlug = slug;
        showSolve();
        $("#solveTitle").textContent = "题目加载中…";
        $("#descPane").innerHTML = '<div class="muted">题面加载中…</div>';
        $("#editorPane").innerHTML = '<div class="muted">加载代码编辑器…</div>';
        const retry = () => { const rb = $("#retryBtn"); if (rb) rb.addEventListener("click", () => openProblem(slug)); };
        try {
          const d = await call("leetcode/get_problem", { titleSlug: slug });
          const title = `${d.frontendQuestionId}. ${esc(d.titleCn || d.title || slug)}`;
          $("#solveTitle").textContent = title;
          let stats = "";
          try { const st = JSON.parse(d.stats || "{}"); if (st.acRate) stats = `通过率 ${st.acRate} · AC ${st.totalAccepted || "?"} / 提交 ${st.totalSubmission || "?"}`; } catch { /* stats optional */ }
          const head = `<h2>${title} <span class="${diffClass(d.difficulty)}" style="font-size:13px">${esc(d.difficulty || "")}</span></h2>${stats ? `<div class="stats">${esc(stats)}</div>` : ""}`;
          const snippets = d.codeSnippets || [];
          if (d.isPaidOnly || (!d.content && snippets.length === 0)) {
            const reason = d.isPaidOnly ? "该题是力扣会员（付费）题目，未开通会员时无法获取题面与代码模板" : "未获取到题面或代码模板（可能是接口偶发返回空）";
            $("#descPane").innerHTML = `${head}<div class="result bad">${esc(reason)}。<div style="margin-top:10px"><button id="retryBtn" type="button">重试</button></div></div>`;
            $("#editorPane").innerHTML = '<div class="muted">此题暂不可作答。</div>';
            retry();
            return;
          }
          state.snippets = snippets;
          const langs = snippets.map((s) => `<option value="${esc(s.langSlug)}">${esc(s.lang)}</option>`).join("");
          $("#descPane").innerHTML = `${head}<div class="content">${d.content || ""}</div>`;
          $("#editorPane").innerHTML = editorHtml(langs);
          wireEditor();
          fillSnippet(); if (window.__updateEditor) window.__updateEditor();
          $("#favBtn").addEventListener("click", async () => {
            const b = $("#favBtn"); b.disabled = true;
            try { await call("leetcode/toggle_favorite", { titleSlug: slug, favorite: true }, 30000); b.textContent = "★ 已收藏"; }
            catch (e) { $("#editorHint").textContent = "收藏失败（需登录）：" + e.message; }
            finally { b.disabled = false; }
          });
          $("#histBtn").addEventListener("click", async () => {
            const box = $("#history"); box.classList.remove("hidden"); box.textContent = "加载提交历史…";
            try {
              const h = await call("leetcode/submission_list", { titleSlug: slug }, 30000);
              const subs = (h && h.submissions) || [];
              box.textContent = subs.length
                ? subs.map((s) => `#${s.id}  ${s.lang}  status=${s.status}  ${s.runtime || "-"} / ${s.memory || "-"}  ${s.timestamp ? new Date((s.timestamp | 0) * 1000).toLocaleString() : ""}`).join("\n")
                : "（无提交记录或需登录）";
            } catch (e) { box.textContent = "提交历史加载失败（需登录）：" + e.message; }
          });
          $("#runBtn").addEventListener("click", () => judge("run"));
          $("#submitBtn").addEventListener("click", () => judge("submit"));
        } catch (e) {
          $("#descPane").innerHTML = `<div class="result bad">题面加载失败：${esc(e.message)}<div style="margin-top:10px"><button id="retryBtn" type="button">重试</button></div></div>`;
          $("#editorPane").innerHTML = '<div class="muted">加载失败，请点“重试”。</div>';
          retry();
        }
      }

      async function judge(mode) {
        const btn = mode === "run" ? $("#runBtn") : $("#submitBtn");
        const box = $("#result");
        btn.disabled = true; box.classList.remove("hidden", "ok", "bad"); box.textContent = mode === "run" ? "运行中…" : "提交判题中…";
        try {
          const method = mode === "run" ? "leetcode/run_code" : "leetcode/submit_code";
          const r = await call(method, { titleSlug: state.activeSlug, lang: $("#lang").value, code: $("#code").value, inputs: (window.__sample || "") }, 120000);
          const ok = r.status === "Accepted";
          box.classList.add(ok ? "ok" : "bad");
          box.textContent = [
            `状态：${r.statusLabel || r.status || "-"}`,
            r.runtime ? `执行用时：${r.runtime}` : "",
            r.memory ? `内存消耗：${r.memory}` : "",
            r.expectedOutput ? `期望输出：\n${r.expectedOutput}` : "",
            r.codeOutput ? `输出：\n${r.codeOutput}` : "",
            r.compileError ? `编译错误：\n${r.compileError}` : "",
            r.error ? `错误：\n${r.error}` : "",
            r.message && !r.compileError ? `${r.message}` : "",
          ].filter(Boolean).join("\n");
        } catch (e) {
          box.classList.add("bad"); box.textContent = "失败：" + e.message;
        } finally { btn.disabled = false; }
      }

      function whoText(r, label) {
        const u = (r && r.username) || label || "";
        const n = r && r.nickname;
        return n && n !== u ? `${n}(${u})` : u;
      }
      function afterLogin(r, label) {
        $("#login").classList.add("hidden");
        renderMe({ authenticated: true, username: (r && r.username) || label || "", nickname: r && r.nickname });
        loadDaily();
        return loadProblems(true);
      }

      let oneClickTimer = null;
      function stopOneClickPoll() { if (oneClickTimer) { clearTimeout(oneClickTimer); oneClickTimer = null; } }
      async function doOneClickLogin() {
        const hint = () => $("#oneClickHint");
        stopOneClickPoll();
        $("#oneClickLoginBtn").disabled = true;
        $("#loginMsg").textContent = "";
        hint().textContent = "正在打开受控浏览器窗口到力扣官方登录页……";
        try {
          await call("leetcode/browser_login_start", {}, 15000);
        } catch (e) {
          hint().textContent = "";
          $("#loginMsg").textContent = "打开浏览器失败：" + e.message + "（可用下方『手动粘贴 Cookie』）。";
          $("#oneClickLoginBtn").disabled = false;
          return;
        }
        hint().textContent = "已弹出一个【专用登录窗口】——它没有地址栏/标签页，任务栏里是单独的图标，和你平时的 Chrome 不一样。请在【这个窗口】里点『登录』，用手机号/验证码或账号密码完成登录（含滑块）。你在这个窗口登录成功后，这里几秒内会自动检测到并进入，无需粘贴 Cookie。";
        const started = Date.now();
        const tick = async () => {
          let r;
          try {
            r = await call("leetcode/browser_login_poll", {}, 28000);
          } catch (e) {
            // 单次轮询超时/异常视为瞬时问题，继续轮询直到总超时
            hint().textContent = "登录检测中（网络较慢或需代理，重试中）…";
            if (Date.now() - started > 310000) {
              stopOneClickPoll();
              $("#oneClickLoginBtn").disabled = false;
              $("#loginMsg").textContent = "登录检测中断：" + e.message + "（可改用『手动粘贴 Cookie』）。";
              return;
            }
            oneClickTimer = setTimeout(tick, 3000);
            return;
          }
          if (r && r.username) {
            stopOneClickPoll();
            hint().textContent = "";
            await afterLogin(r, "浏览器登录");
            return;
          }
          if (r && r.status === "error") {
            stopOneClickPoll();
            hint().textContent = "";
            $("#loginMsg").textContent = r.message || "浏览器登录失败，请改用『手动粘贴 Cookie』。";
            $("#oneClickLoginBtn").disabled = false;
            return;
          }
          if (r && r.status === "timeout") {
            stopOneClickPoll();
            hint().textContent = "";
            $("#loginMsg").textContent = "超时：没检测到你在弹出的浏览器窗口里完成登录。可重试，或用『手动粘贴 Cookie』。";
            $("#oneClickLoginBtn").disabled = false;
            return;
          }
          if (Date.now() - started > 310000) {
            stopOneClickPoll();
            try { await call("leetcode/browser_login_cancel", {}, 10000); } catch {}
            $("#oneClickLoginBtn").disabled = false;
            hint().textContent = "";
            $("#loginMsg").textContent = "已停止检测。可重试，或用『手动粘贴 Cookie』。";
            return;
          }
          oneClickTimer = setTimeout(tick, 2500);
        };
        oneClickTimer = setTimeout(tick, 2500);
      }

      $("#oneClickLoginBtn").addEventListener("click", doOneClickLogin);
      $("#logoutBtn").addEventListener("click", async () => { try { await call("leetcode/logout", {}); } catch {} location.reload(); });
      $("#refreshBtn").addEventListener("click", () => loadProblems(true));
      let searchTimer = null;
      const queueSearch = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadProblems(true), 450); };
      $("#search").addEventListener("input", queueSearch);
      $("#search").addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(searchTimer); loadProblems(true); } });
      $("#difficulty").addEventListener("change", () => loadProblems(true));
      $("#status").addEventListener("change", () => loadProblems(true));
      $("#resetBtn").addEventListener("click", () => {
        $("#search").value = ""; $("#difficulty").value = ""; $("#status").value = "";
        state.tags = []; state.categorySlug = ""; state.searching = false; state.tagsExpanded = false;
        state.sortField = ""; state.sortDesc = false; state.mode = "list";
        $("#sortField").value = ""; $("#sortDir").textContent = "↑";
        renderCats(); renderTags(); loadProblems(true);
      });
      $("#tagsToggle").addEventListener("click", () => { state.tagsExpanded = !state.tagsExpanded; renderTags(); });

      // 排序：非默认顺序需要覆盖整个筛选结果，因此走本地排序（loadProblems 会拉全量）。
      $("#sortField").addEventListener("change", () => {
        state.sortField = $("#sortField").value;
        if (!state.sortField) state.fullSetKey = "";
        loadProblems(true);
      });
      $("#sortDir").addEventListener("click", () => {
        state.sortDesc = !state.sortDesc;
        $("#sortDir").textContent = state.sortDesc ? "↓" : "↑";
        if (!state.sortField) { $("#sortField").value = "FRONTEND_ID"; state.sortField = "FRONTEND_ID"; loadProblems(true); }
        else { renderList(); $("#listStatus").textContent = activeFilterSummary(); }
      });

      // 随机一题：在当前筛选结果的范围内抽一道，避免"随机"永远落在第一页。
      $("#randomBtn").addEventListener("click", async () => {
        try {
          const total = Math.max(1, state.total || 1);
          const skip = Math.floor(Math.random() * Math.min(total, 1000));
          const data = await call("leetcode/list_problems", { skip, limit: 1, filters: currentFilters(), categorySlug: state.categorySlug });
          const q = (data.questions || [])[0];
          if (!q) { $("#listStatus").textContent = "当前筛选下没有题目"; return; }
          await openProblem(q.titleSlug);
        } catch (e) {
          $("#listStatus").textContent = "随机一题失败：" + e.message;
        }
      });

      function showListOnly() {
        $("#solveView").classList.add("hidden");
        $("#sectionView").classList.add("hidden");
        $("#listView").classList.remove("hidden");
      }
      function showSection(title, sub) {
        $("#listView").classList.add("hidden");
        $("#solveView").classList.add("hidden");
        $("#sectionView").classList.remove("hidden");
        $("#sectionTitle").textContent = title;
        $("#sectionSub").textContent = sub || "";
      }

      async function switchView(view) {
        document.querySelectorAll("#nav .nav-item[data-view]").forEach((btn) => {
          btn.setAttribute("aria-current", btn.dataset.view === view ? "page" : "false");
        });
        if (view === "daily") { showListOnly(); openDaily(); return; }
        if (view === "explore" || view === "studyplan") { state.section = view; return renderSection(view); }
        state.mode = view === "favs" ? "favs" : "list";
        showListOnly();
        loadProblems(true);
      }

      // 板块内容在插件内渲染；只有题单/书本这类深层页面才交给系统浏览器。
      async function renderSection(view) {
        showSection(view === "leetbook" ? "LeetBook" : view === "studyplan" ? "学习计划" : "探险模式", "加载中…");
        const body = $("#sectionBody");
        try {
          if (view === "studyplan") {
            const catalogs = await call("leetcode/study_plans", { catalogSlug: "" }, 30000);
            const list = catalogs.catalogs || [];
            $("#sectionSub").textContent = `共 ${list.length} 个分类`;
            let html = "";
            for (const catalog of list) {
              const plans = await call("leetcode/study_plans", { catalogSlug: catalog.slug, offset: 0, limit: 30 }, 30000);
              const cards = (plans.studyPlans || []).map((plan) => `
                <div class="cardx">
                  <div class="t">${esc(plan.name)}</div>
                  <div class="d">${esc(plan.highlight || "")}</div>
                  <div class="meta"><span>${plan.questionNum || 0} 题</span>${plan.premiumOnly ? '<span class="pill">Plus</span>' : ""}</div>
                  <button type="button" data-open="/studyplan/${esc(plan.slug)}/">打开题单</button>
                </div>`).join("");
              html += `<div class="group">${esc(catalog.name)}（${(plans.studyPlans || []).length}${plans.total ? " / " + plans.total : ""}）</div><div class="cards">${cards || '<span class="muted">该分类暂无题单</span>'}</div>`;
            }
            body.innerHTML = html || '<span class="muted">没有可显示的学习计划</span>';
          } else if (view === "leetbook") {
            const data = await call("leetcode/leetbooks", {}, 40000);
            const books = data.books || [];
            $("#sectionSub").textContent = `${(data.categories || []).length} 个分类 · ${books.length} 本书`;
            body.innerHTML = `<div class="cards">${books.map((book) => `
              <div class="cardx">
                <div class="t">${esc(book.title)}</div>
                <div class="d">${esc((book.description || "").slice(0, 90))}</div>
                <div class="meta"><span>已学 ${book.totalStudied || 0}</span></div>
                <button type="button" data-open="/leetbook/${esc(book.slug)}/">开始阅读</button>
              </div>`).join("") || '<span class="muted">没有可显示的 LeetBook</span>'}</div>`;
          } else {
            // 探险模式没有可公开调用的列表接口（内容按会话下发），给出明确说明而不是空白页。
            $("#sectionSub").textContent = "探险模式的关卡由力扣按会话下发，插件暂无稳定的列表接口，点击可在浏览器中查看。";
            body.innerHTML = `<div class="cards">
              <div class="cardx"><div class="t">数据结构与算法</div><div class="d">35 关卡</div><button type="button" data-open="/explore/">打开探险模式</button></div>
              <div class="cardx"><div class="t">数据库</div><div class="d">5 关卡</div><button type="button" data-open="/explore/">打开探险模式</button></div>
              <div class="cardx"><div class="t">系统与软件设计</div><div class="d">5 关卡</div><button type="button" data-open="/explore/">打开探险模式</button></div>
              <div class="cardx"><div class="t">数学</div><div class="d">7 关卡</div><button type="button" data-open="/explore/">打开探险模式</button></div>
            </div>`;
          }
          body.querySelectorAll("button[data-open]").forEach((btn) => btn.addEventListener("click", async () => {
            try { await call("leetcode/open_site", { path: btn.dataset.open }, 15000); }
            catch (e) { $("#sectionSub").textContent = "打开失败：" + e.message; }
          }));
        } catch (e) {
          $("#sectionSub").textContent = "加载失败：" + e.message;
          body.innerHTML = "";
        }
      }

      document.querySelectorAll("#nav .nav-item[data-view]").forEach((btn) => btn.addEventListener("click", () => switchView(btn.dataset.view)));
      $("#navToggle").addEventListener("click", () => {
        const collapsed = $("#nav").classList.toggle("collapsed");
        $("#navToggle .ico").textContent = collapsed ? "»" : "«";
      });

      function renderCompanies() {
        $("#companies").innerHTML = COMPANIES.map(([name, path]) => `<button type="button" data-path="${esc(path)}">${esc(name)}</button>`).join("");
        $("#companies").querySelectorAll("button").forEach((btn) => btn.addEventListener("click", async () => {
          try { await call("leetcode/open_site", { path: btn.dataset.path }, 15000); } catch (e) { /* surfaced below */ }
        }));
      }

      async function loadDaily() {
        try {
          const rec = await call("leetcode/daily_question", {}, 20000);
          const q = rec && rec.question;
          if (!q) { $("#dailyBody").textContent = "今日暂无题目"; return; }
          state.daily = q;
          $("#dailyBody").innerHTML = `
            <div class="muted" style="font-size:11px;margin-bottom:4px">${esc(rec.date || "")} · ${esc(DIFF_CN[String(q.difficulty || "").toUpperCase()] || q.difficulty || "")}</div>
            <div class="daily-q" data-slug="${esc(q.titleSlug)}">[${esc(q.questionFrontendId)}] ${esc(q.translatedTitle || q.title)}</div>`;
          $("#dailyBody .daily-q").addEventListener("click", () => openProblem(q.titleSlug));
        } catch (e) {
          $("#dailyBody").textContent = "每日一题加载失败";
        }
      }

      function openDaily() {
        if (state.daily && state.daily.titleSlug) { openProblem(state.daily.titleSlug); return; }
        $("#listStatus").textContent = "每日一题还没加载出来，稍后再试。";
        showList();
      }

      function renderMe(status) {
        const who = $("#who");
        if (!status || !status.authenticated) { who.innerHTML = ""; return; }
        const name = status.nickname || status.username || "";
        // 沙箱 CSP 不允许加载站外图片，所以头像用首字母圆形徽章，而不是 <img src>。
        const initial = esc((name || "?").slice(0, 1).toUpperCase());
        who.innerHTML = `<span class="avatar" id="meAvatar" title="力扣头像">${initial}</span> 已登录：${esc(name)}${status.username && status.nickname ? `（${esc(status.username)}）` : ""}`;
        // The sandbox CSP allows `img-src data:`, so the sidecar relays the real
        // avatar bytes; a letter badge remains as the fallback.
        call("leetcode/avatar", {}, 25000).then((res) => {
          if (!res || !res.avatar) return;
          const holder = document.getElementById("meAvatar");
          if (!holder) return;
          const img = document.createElement("img");
          img.className = "avatar-img";
          img.src = res.avatar;
          img.alt = name;
          holder.replaceWith(img);
        }).catch(() => {});
      }

      function totalPages() { return Math.max(1, Math.ceil((state.total || 0) / state.pageSize)); }
      function goToPage(n) {
        const p = Math.min(totalPages(), Math.max(1, n | 0));
        if (!p || p === state.page) { renderPager(); return; }
        state.page = p; loadProblems(false);
      }
      $("#prevBtn").addEventListener("click", () => goToPage(state.page - 1));
      $("#nextBtn").addEventListener("click", () => goToPage(state.page + 1));
      $("#goBtn").addEventListener("click", () => goToPage(parseInt($("#pageInput").value, 10)));
      $("#pageInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); goToPage(parseInt($("#pageInput").value, 10)); } });
      $("#pageSize").addEventListener("change", () => { state.pageSize = parseInt($("#pageSize").value, 10) || 30; loadProblems(true); });

      function showSolve() { $("#listView").classList.add("hidden"); $("#solveView").classList.remove("hidden"); }
      function showList() { $("#solveView").classList.remove("fullscreen"); updateFsBtn(); $("#solveView").classList.add("hidden"); $("#listView").classList.remove("hidden"); }
      function updateFsBtn() { const on = $("#solveView").classList.contains("fullscreen"); $("#fsBtn").textContent = on ? "⤡ 退出全屏" : "⤢ 全屏"; }
      function toggleFs() { $("#solveView").classList.toggle("fullscreen"); updateFsBtn(); }
      $("#backBtn").addEventListener("click", showList);
      $("#fsBtn").addEventListener("click", toggleFs);

      (function initSplitter() {
        const sp = $("#splitter"); if (!sp) return;
        let dragging = false;
        sp.addEventListener("mousedown", (e) => { dragging = true; sp.classList.add("dragging"); e.preventDefault(); });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const g = $("#solveGrid").getBoundingClientRect();
          let pct = ((e.clientX - g.left) / g.width) * 100;
          pct = Math.min(80, Math.max(20, pct));
          $("#solveGrid").style.setProperty("--descw", pct + "%");
        });
        window.addEventListener("mouseup", () => { if (dragging) { dragging = false; sp.classList.remove("dragging"); } });
      })();

      window.dbxPlugin.ready.then(async () => {
        renderCats();
        renderCompanies();
        loadTags();
        loadDaily();
        try {
          const s = await call("leetcode/status", {});
          if (s && s.authenticated) {
            $("#login").classList.add("hidden");
            renderMe(s);
            await loadProblems(true);
          }
        } catch (e) { /* stay on login screen */ }
      });
    </script>
  </body>
</html>
