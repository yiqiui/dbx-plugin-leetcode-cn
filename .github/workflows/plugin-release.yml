name: Release DBX plugin

# 说明：GitHub 只会执行仓库根目录 .github/workflows/ 下的工作流。
# 当本插件作为独立仓库发布时，把此文件放到仓库根的 .github/workflows/plugin-release.yml。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # 复用 dbx 官方打包工作流：构建各平台 .dbxp + 生成产物元数据（release-candidates.json）
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-sdk-v1
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.6
      # 含 Rust sidecar → 需要为每个目标平台构建（native 插件不能用 universal）
      build-matrix: '{"include":[{"runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"runner":"macos-14","target":"aarch64-apple-darwin"}]}'
